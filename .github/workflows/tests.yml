name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils djvulibre-bin ghostscript tesseract-ocr tmux
      - name: Run the tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Install and run the command
        run: |
          python -m pip install .
          shelffind --version
          python -m shelffind --version
