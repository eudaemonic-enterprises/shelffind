[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelffind"
dynamic = ["version"]
description = "Find and open local documents by filename, folder, or passage"
requires-python = ">=3.11"
license = {file = "LICENSE"}
readme = "README.md"
authors = [{name = "Eudaemonic Enterprises Inc."}]
dependencies = []

[project.scripts]
shelffind = "shelffind.cli:main"

[project.urls]
Source = "https://github.com/eudaemonic-enterprises/shelffind"

[tool.setuptools.dynamic]
version = {attr = "shelffind.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
